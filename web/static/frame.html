<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>경매로 내차GET — 법원 자동차 경매 분석</title>
<link rel="manifest" href="/static/manifest.webmanifest"/>
<meta name="theme-color" content="#0b142b"/>
<link rel="apple-touch-icon" href="/static/icons/apple-touch-180.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png"/>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 820px at 50% -8%,#16305e 0%,#0b142b 55%,#080f22 100%);
       display:flex;align-items:center;justify-content:center;padding:14px;
       font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif}

  /* 목업 — 화면 높이에 꽉 차게, 내용은 전부 이 안에(iframe). 어두운 베젤 없이 깔끔한 라운드 카드(InterSafety AI 방식) */
  .phone{position:relative;width:min(420px,94vw);height:min(920px,96vh);
         background:#fff;border-radius:32px;overflow:hidden;
         box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .phone iframe{width:100%;height:100%;border:0;display:block}

  /* 설치 안내 — 상/하단 별도 블록이 아니라 우측 하단 코너의 은은한 플로팅 칩(자동 사라짐) */
  .hint{position:fixed;right:16px;bottom:16px;max-width:min(320px,60vw);
        color:#c4cde0;font-size:12px;line-height:1.55;background:rgba(8,15,34,.62);backdrop-filter:blur(8px);
        border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:10px 13px;
        box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .5s ease;z-index:5}
  .hint b{color:#f3b63e}
  .hint .x{position:absolute;top:6px;right:9px;color:#7f8bab;cursor:pointer;font-size:14px;line-height:1}
</style>
</head>
<body>
  <div class="phone"><iframe id="f" title="경매로 내차GET"></iframe></div>

  <div class="hint" id="hint">
    <span class="x" onclick="this.parentNode.style.display='none'">✕</span>
    💻 PC에 <b>설치</b>하면 넓은 데스크톱 화면으로 열립니다 (주소창 오른쪽 <b>설치</b> 아이콘)<br>
    📱 휴대폰에서는 <b>홈 화면에 추가</b>
  </div>

<script>
  // 해시로 전달된 '내부 경로'만 iframe에 로드(외부 URL 주입 차단)
  var p = "/";
  try { p = decodeURIComponent((location.hash || "#/").slice(1)) || "/"; } catch (e) { p = "/"; }
  if (!p.startsWith("/") || p.startsWith("//")) p = "/";
  document.getElementById("f").src = p;
  // 설치 안내 칩은 8초 뒤 자연스럽게 사라짐
  setTimeout(function(){ var h=document.getElementById("hint"); if(h){ h.style.opacity="0"; setTimeout(function(){ h.style.display="none"; }, 600); } }, 8000);
  // 프레임 페이지에서도 설치 가능하도록 서비스워커 등록(설치 시 데스크톱 화면으로 열림)
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
</script>
</body>
</html>
