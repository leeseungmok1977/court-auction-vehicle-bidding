<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>경매로 내차GET — 법원 자동차 경매 분석</title>
<link rel="manifest" href="/static/manifest.webmanifest"/>
<meta name="theme-color" content="#0b142b"/>
<link rel="apple-touch-icon" href="/static/icons/apple-touch-180.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png"/>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 800px at 50% -10%,#16305e 0%,#0b142b 55%,#080f22 100%);
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px;
       font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif}
  .brand{color:#e7ecf5;text-align:center;line-height:1.3}
  .brand .t{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .brand .t b{color:#f3b63e}
  .brand .s{font-size:12.5px;color:#9aa7c2;margin-top:2px}
  .phone{width:min(430px,96vw);height:min(880px,86vh);background:#fff;border-radius:34px;overflow:hidden;
         box-shadow:0 28px 80px rgba(0,0,0,.55);border:7px solid #05070f;position:relative}
  .phone iframe{width:100%;height:100%;border:0;display:block}
  .hint{color:#9aa7c2;font-size:12.5px;text-align:center;line-height:1.6;max-width:440px}
  .hint b{color:#f3b63e}
</style>
</head>
<body>
  <div class="brand"><div class="t">경매로 <b>내차GET</b></div><div class="s">법원 자동차 경매 · 예상낙찰가 분석</div></div>
  <div class="phone"><iframe id="f" title="경매로 내차GET"></iframe></div>
  <div class="hint">💻 PC에 <b>설치</b>하면 넓은 데스크톱 화면으로 열립니다 — 주소창 오른쪽 <b>설치</b> 아이콘 클릭<br>📱 휴대폰에서는 이 화면 그대로 · <b>홈 화면에 추가</b></div>
<script>
  // 해시로 전달된 '내부 경로'만 iframe에 로드(외부 URL 주입 차단)
  var p = "/";
  try { p = decodeURIComponent((location.hash || "#/").slice(1)) || "/"; } catch (e) { p = "/"; }
  if (!p.startsWith("/") || p.startsWith("//")) p = "/";
  document.getElementById("f").src = p;
  // 프레임 페이지에서도 설치 가능하도록 서비스워커 등록(설치 시 데스크톱 화면으로 열림)
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
</script>
</body>
</html>
